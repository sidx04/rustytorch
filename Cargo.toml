[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["sidx04"]

[workspace.dependencies]
thiserror = "2"
anyhow = "1"

rt-core = { path = "crates/core" }
rt-tensor = { path = "crates/tensor" }
rt-autograd = { path = "crates/autograd" }
rt-nn = { path = "crates/nn" }
rt-optimiser = { path = "crates/optimiser" }
rt-data = { path = "crates/data" }
rt-training = { path = "crates/training" }
rt-vision = { path = "crates/vision" }
rt-transformer = { path = "crates/transformer" }
rt-profiling = { path = "crates/profiling" }
rt-quantization = { path = "crates/quantization" }
